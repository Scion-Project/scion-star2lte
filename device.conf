# devices/star2lte/device.conf: the Samsung Galaxy S9+ (SM-G965F, Exynos 9810). README.md here has what differs from the S9 and
# where each fact came from. Every area is "missing" because nothing has been seen working on this phone; each note
# says what is written for it (the S9's drivers, the same chips by the device trees). NOTHING HAS RUN ON AN S9+.
# The S9's statuses (devices/starlte/device.conf) say what was seen on an S9 with the same drivers.

device star2lte
	title       Galaxy S9+
	vendor      Samsung
	soc         exynos9810
	defconfig   star2lte_defconfig
	maintainer  Scion (README.md)
	status      display     missing   UEFI's framebuffer, 1440 x 2960 at 0xCC000000 as on the S9, from the S9's UEFI borrowed (mkimage.sh -U); not seen on an S9+; the brightness driver of the S9 left out (this phone's panel is s6e3ha8_star2, another variant); fb_flip and fb_dpp (the same DECON and DPP): written for the S9, not seen here
	status      cpu         missing   A55s 2 and 3 (cpus=2 bootcpu=2, the default), the S9's; the M3s (m3_prep=3) and the clusters' clocks (cpufreq_lit, cpufreq_gov): the same SoC, not seen on an S9+
	status      touch       missing   Samsung S6SY761 (sec_ts, firmware y761_star2) at 0x48 on USI03's HSI2C, its IRQ gpa1-0 and supplies LDO35/LDO43 as on the S9 (s6sy761=1): not seen on an S9+
	status      buttons     missing   power gpa2-4, volume gpa0-3/gpa0-4, Bixby gpa0-6, the S9's pins (exynos_keys=1): not seen on an S9+
	status      storage     missing   UFS read through the loader and the S9's UEFI (ufs=2), the same controller; /private/var in USERDATA (ufs_write=1 var_hfs=ufs_USERDATA_data): not seen on an S9+
	status      gpu         missing   Mali-G72 MP18, the same SoC (mali=N): not seen on an S9+
	status      audio       missing   ABOX and the MAX98512s at the S9's addresses, codec CS47L93 as on the S9 (abox=N, max98512=N): not seen, not heard on an S9+
	status      battery     missing   the MAX77705's gauge and charger, read only, with this phone's battery: 3500 mAh (fuel gauge capacity 3303), its own thermistor table (max77705=1): not seen on an S9+
	status      wifi        missing   BCM4361 on PCIe channel 0 as on the S9 (wifi_pcie=N, brcmfmac=N; firmware from the phone): not seen on an S9+
	status      bluetooth   partial   BCM4361's Bluetooth on UART_BT as on the S9 (bt=7, CONFIG_BT=7): Broadcom's patch, 4 Mbaud, the EFS address, seen on an S9+ (SM-G965N), 12 November; iOS (userland BT=1, the default since scion-kernel 6effc65): BlueTool's D22AP boot and init scripts through com.apple.uart.bluetooth (result 0), bluetoothd's stack STACK_READY and powered on, an active LE scan hearing advertisers, seen on that phone with the jobs loaded by hand, 12 November; Settings, pairing and audio not yet seen on an S9+ (../starlte/BLUETOOTH.md)
	status      cellular    missing
	status      haptic      missing   the MAX77705's haptic block and PWM channel 1 (max77705_haptic=1), at the S9's strength (at most 70 % duty; Samsung drives this motor harder): not felt on an S9+
	status      thermal     missing   the TMU (tmu=N), the same SoC; the CPU governor's limits (cpufreq_gov=1): not seen on an S9+
	status      camera      missing   rear: S5K2L3 wide (0x20) and S5K3M3 tele (0x5A, the S9 has none); front: S5K3H1 (0x6A), as the S9's: the S9's front-camera stages (cam_s9=N) may apply; nothing tried on an S9+; no driver for the tele
	status      torch       missing   the S2MPB02's flash block, as on the S9 (torch=N): not seen on an S9+
	status      usb         missing   USB serial log and console (usb_gadget=5 max77705_usbsw=1), the same PHY and MUIC: not seen on an S9+
